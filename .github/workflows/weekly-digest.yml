name: Weekly Cosmic Digest

on:
  schedule:
    # Every Sunday at 9:00am UTC = 7:00pm AEST
    - cron: '0 9 * * 0'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab for testing

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install node-fetch

      - name: Run weekly digest script
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-weekly-digest.js
