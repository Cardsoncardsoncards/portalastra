name: CI

# Build, lint and test on every push and every pull request. Nothing enforced
# this before, so a change that failed `next build` only surfaced when the
# Netlify deploy went red.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # The build only needs these to be present, not valid: routes read them
        # at request time, and every module-scope client is lazily constructed.
        env:
          NEXT_PUBLIC_SITE_URL: https://portalastra.com
        run: npm run build
