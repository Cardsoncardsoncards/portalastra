name: Monthly Cosmic Forecast

on:
  schedule:
    # 1st of every month at 9am UTC (7pm AEST)
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  send-monthly-forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run monthly forecast script
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-monthly-forecast.js
